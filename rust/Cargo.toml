[package]
name = "flatter-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of hot kernels from flatter (fast lattice reduction)"
license = "LGPL-3.0-or-later"
autobenches = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bench_gemm"
path = "benches/bench_gemm.rs"
bench = false

[[bin]]
name = "flatter"
path = "src/bin/flatter.rs"

[dependencies]
rayon = "1.10"
rug = { version = "1.29", default-features = false, features = ["integer", "float"] }
gmp-mpfr-sys = { version = "1.7", default-features = false, features = ["mpfr", "use-system-libs"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
